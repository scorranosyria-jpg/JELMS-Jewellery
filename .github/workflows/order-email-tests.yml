name: JELMS order email checks
on:
  pull_request:
    paths:
      - 'order-email.js'
      - 'server.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/order-email-tests.yml'
  push:
    branches:
      - 'feature/jelms-order-emails'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e7f7e3 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run order email tests (mock only)
        run: node --test tests/order-email.test.js
      - name: Validate server syntax
        run: node --check server.js
