<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt — Jelms Jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Caveat:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">

  <div id="site-header"></div>

  <main class="contact-page">
    <div class="section-heading">
      <h1 class="section-heading__title" id="contact-heading"></h1>
      <p class="section-heading__subtitle" id="contact-intro"></p>
    </div>

    <!--
      TODO: Formular später an ein echtes Backend / einen
      Formular-Service anbinden (z. B. Formspree, eigene API-Route).
      Aktuell rein optisch: beim Absenden wird nur lokal der
      Bestätigungstext angezeigt (siehe app.js: initContactPage).
    -->
    <div class="contact-content">
      <form class="contact-form" id="contact-form">
        <div class="form-field">
          <label for="name">Name</label>
          <input id="name" name="name" required>
        </div>
        <div class="form-field">
          <label for="email">E-Mail</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="form-field">
          <label for="message">Nachricht</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Senden</button>
      </form>

      <p class="contact-confirmation" id="contact-confirmation" hidden></p>
    </div>

    <!-- Christmas markets information -->
    <section class="event-preview container" id="event-preview-section"></section>
  </main>

  <div id="site-footer"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
